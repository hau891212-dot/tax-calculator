<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>個人綜合所得稅試算</title>
<style>
/* 玻璃卡風格:柔光彩色背景 + 半透明霧面卡片(backdrop-filter),靛藍→紫漸層為唯一重點色。填完 → 按按鈕 → 才顯示結果與級距。 */
:root{
  --ink:#1b2340; --sub:#5b6585; --sep:rgba(27,35,64,.09);
  --glass:rgba(255,255,255,.52); --glass-hi:rgba(255,255,255,.72); --glass-lo:rgba(255,255,255,.34); --edge:rgba(255,255,255,.78);
  --shadow:0 10px 36px rgba(70,80,160,.16),inset 0 1px 0 rgba(255,255,255,.85);
  --blue:#4660f0; --violet:#8a5cff; --grad:linear-gradient(135deg,#4f6bff 0%,#8a5cff 100%);
  --green:#12804a; --red:#d4203c; --orange:#b4540a; --orange-soft:rgba(255,236,206,.85);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Hiragino Sans","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.47;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;font-weight:500;
  background:linear-gradient(135deg,#dce9ff 0%,#e8ddff 48%,#ffe2ee 100%) fixed;
  padding:0 max(16px,env(safe-area-inset-left)) calc(124px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-right))}
[hidden]{display:none!important}
/* 背景柔光球 */
.bg{position:fixed;inset:-40px;overflow:hidden;pointer-events:none;z-index:0;transform:translate(var(--px,0px),var(--py,0px));transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.62}
.bg i:nth-child(1){width:46vmax;height:46vmax;left:-14vmax;top:-12vmax;background:#7ea6ff;animation:fl1 26s ease-in-out infinite alternate}
.bg i:nth-child(2){width:40vmax;height:40vmax;right:-12vmax;top:18vh;background:#c3a2ff;animation:fl2 30s ease-in-out infinite alternate}
.bg i:nth-child(3){width:38vmax;height:38vmax;left:12vw;bottom:-16vmax;background:#ffa9c8;animation:fl3 34s ease-in-out infinite alternate}
.bg i:nth-child(4){width:26vmax;height:26vmax;right:8vw;bottom:6vh;background:#8fe6d3;opacity:.45;animation:fl1 38s ease-in-out infinite alternate-reverse}
@keyframes fl1{to{transform:translate(6vmax,4vmax) scale(1.08)}}
@keyframes fl2{to{transform:translate(-5vmax,6vmax) scale(.94)}}
@keyframes fl3{to{transform:translate(7vmax,-4vmax) scale(1.1)}}
.wrap{position:relative;z-index:1;max-width:640px;margin:0 auto}
header{padding:calc(36px + env(safe-area-inset-top)) 4px 6px}
h1{font-size:2.1rem;font-weight:700;letter-spacing:-.025em;margin:0;line-height:1.15;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.lead{color:var(--sub);font-size:1.02rem;font-weight:600;margin:8px 0 0}
.example{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}
.link{border:1px solid var(--edge);background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--blue);font:inherit;font-size:.9rem;font-weight:700;padding:7px 16px;border-radius:99px;cursor:pointer;box-shadow:0 2px 10px rgba(70,80,160,.1)}
.link:active{opacity:.6}

/* 玻璃面板共用 */
.list,details.more>summary,.card,.hero,.cta{
  background:var(--glass);border:1px solid var(--edge);box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(26px) saturate(165%);backdrop-filter:blur(26px) saturate(165%)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .list,details.more>summary,.card,.hero{background:rgba(255,255,255,.88)}.cta{background:rgba(250,250,255,.95)}}

.group{margin-top:26px}
.group-title{font-size:.82rem;font-weight:800;color:var(--sub);letter-spacing:.04em;margin:0 0 8px 14px}
.list{border-radius:24px;overflow:hidden}
.footer{color:var(--sub);font-size:.82rem;font-weight:600;line-height:1.55;margin:9px 14px 0}
.row{border-bottom:1px solid var(--sep);padding:0 18px}
.row:last-child{border-bottom:0}
.row-main{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;padding:8px 0}
.row-label{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
.row-label .t{font-size:1.04rem;line-height:1.3;font-weight:700}
.row-label .s{display:block;color:var(--sub);font-size:.8rem;font-weight:600;line-height:1.3;margin-top:1px}
.q{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--edge);background:var(--glass-hi);color:var(--blue);font:inherit;font-size:.82rem;font-weight:700;line-height:1;padding:0;cursor:pointer;box-shadow:0 2px 8px rgba(70,80,160,.15)}
.q:active{transform:scale(.92)}
.q[aria-expanded="true"]{background:var(--grad);color:#fff;border-color:transparent}
.help{margin:0;background:var(--glass-lo);border:0 solid var(--edge);border-radius:16px;padding:0 15px;font-size:.93rem;font-weight:600;line-height:1.62;color:#222b4d;box-shadow:inset 0 1px 0 rgba(255,255,255,.7);
  max-height:0;opacity:0;overflow:hidden;visibility:hidden;transform:translateY(-6px);
  transition:max-height .45s cubic-bezier(.22,.8,.2,1),opacity .3s ease,transform .45s cubic-bezier(.22,.8,.2,1),margin .45s ease,padding .45s ease,visibility 0s .45s,border-width 0s .45s}
.help.open{max-height:var(--h,420px);opacity:1;visibility:visible;border-width:1px;transform:none;margin:0 0 13px;padding:13px 15px;transition-delay:0s}
.help b{display:block;font-size:.78rem;color:var(--blue);font-weight:800;margin-bottom:2px;letter-spacing:.04em}
.help p{margin:0}.help p+p{margin-top:9px}
.ctl{flex:none;display:flex;align-items:center;justify-content:flex-end}

/* 控制元件 */
.money{display:flex;align-items:center;gap:6px;background:var(--glass-lo);border:1px solid var(--edge);border-radius:14px;padding:0 12px;box-shadow:inset 0 1px 3px rgba(70,80,160,.08)}
.money input{width:8.4em;border:0;background:transparent;color:var(--ink);font:inherit;font-size:1.08rem;font-weight:800;text-align:right;padding:9px 0;border-radius:0;-moz-appearance:textfield;font-variant-numeric:tabular-nums}
.money input::-webkit-inner-spin-button{display:none}
.money input::placeholder{color:#a3abc8;font-weight:600}
.money input:focus{outline:0}
.money i{font-style:normal;color:var(--sub);font-size:.92rem;font-weight:700}
.money:focus-within{background:var(--glass-hi);border-color:#fff;box-shadow:0 0 0 3px rgba(79,107,255,.28)}
.row:focus-within .money i{color:var(--blue)}
.stepper{display:flex;align-items:center;background:var(--glass-lo);border:1px solid var(--edge);border-radius:14px;overflow:hidden}
.stepper button{width:44px;height:38px;border:0;background:transparent;color:var(--blue);font-size:1.4rem;line-height:1;padding:0;cursor:pointer}
.stepper button:active{background:rgba(79,107,255,.14)}
.stepper output{min-width:32px;text-align:center;font-size:1.08rem;font-weight:800;font-variant-numeric:tabular-nums}
.seg{position:relative;display:flex;background:var(--glass-lo);border:1px solid var(--edge);border-radius:13px;padding:3px;box-shadow:inset 0 1px 3px rgba(70,80,160,.08)}
.seg button{position:relative;z-index:1;border:0;background:transparent;color:var(--sub);font:inherit;font-size:.93rem;font-weight:600;padding:7px 14px;border-radius:10px;cursor:pointer;white-space:nowrap;transition:color .25s}
.seg button[aria-pressed="true"]{color:#fff;font-weight:800}
.sw{appearance:none;-webkit-appearance:none;width:52px;height:32px;border-radius:16px;background:rgba(27,35,64,.16);position:relative;cursor:pointer;transition:background .2s;margin:0;flex:none;border:1px solid var(--edge)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(27,35,64,.3);transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.sw:checked{background:var(--grad);border-color:transparent}.sw:checked::after{transform:translateX(20px)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid rgba(79,107,255,.5);outline-offset:2px}
details.more{margin-top:26px}
details.more>summary{list-style:none;cursor:pointer;border-radius:24px;padding:17px 18px;display:flex;justify-content:space-between;align-items:center;font-size:1.04rem;font-weight:700}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:"＋";color:var(--blue);font-weight:600}
details.more[open]>summary::after{content:"－"}
details.more[open]>summary{border-bottom-left-radius:0;border-bottom-right-radius:0;box-shadow:none}
details.more>.list{border-top-left-radius:0;border-top-right-radius:0;border-top:1px solid var(--sep)}
details.more .sumsub{display:block;color:var(--sub);font-size:.8rem;font-weight:600}

/* 底部玻璃主按鈕列 */
.cta{position:fixed;left:0;right:0;bottom:0;z-index:20;border-width:1px 0 0;border-radius:24px 24px 0 0;
  padding:12px max(16px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.cta .in{max-width:640px;margin:0 auto}
.cta button{width:100%;height:54px;border:1px solid rgba(255,255,255,.5);border-radius:18px;background:var(--grad);color:#fff;font:inherit;font-size:1.12rem;font-weight:800;cursor:pointer;
  box-shadow:0 8px 24px rgba(79,107,255,.4),inset 0 1px 0 rgba(255,255,255,.45)}
.cta button:active{transform:scale(.985);opacity:.9}

/* 結果 */
#result{margin-top:34px;scroll-margin-top:16px}
.stale{background:var(--orange-soft);color:var(--orange);border:1px solid rgba(255,255,255,.8);border-radius:16px;padding:11px 15px;font-size:.93rem;font-weight:800;margin-bottom:12px}
.dim{opacity:.35;transition:opacity .2s}
.hero{border-radius:28px;padding:28px 22px;text-align:center;position:relative;overflow:hidden;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out;will-change:transform}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(420px circle at var(--lx,50%) var(--ly,0%),rgba(255,255,255,.72),transparent 62%);pointer-events:none;transition:background .1s}
.hero>*{position:relative}
.hero .k{color:var(--sub);font-size:.95rem;font-weight:700}
.hero .n{font-size:3.1rem;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:4px 0;font-variant-numeric:tabular-nums}
.hero .n.pay{color:var(--red)}.hero .n.refund{color:var(--green)}
.hero .n small{font-size:1.1rem;font-weight:700;color:var(--sub);margin-left:4px}
.hero .why{color:var(--sub);font-size:.95rem;font-weight:600}
.card{border-radius:24px;padding:20px 18px;margin-top:14px}
.card h3{font-size:1.12rem;font-weight:800;margin:0 0 4px}
.card .cap{color:var(--sub);font-size:.88rem;font-weight:600;margin:0 0 12px}
.ladder{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:6px}
.ladder div{background:var(--glass-lo);border:1px solid var(--edge);border-radius:14px;padding:11px 2px 9px;text-align:center;color:var(--sub);font-size:.68rem;font-weight:600;line-height:1.35}
.ladder div b{display:block;font-size:1.06rem;font-weight:800;color:var(--ink)}
.ladder div.on{background:var(--grad);border-color:transparent;color:rgba(255,255,255,.9);box-shadow:0 6px 18px rgba(79,107,255,.4)}
.ladder div.on b{color:#fff}
.mine{margin-top:14px;font-size:1.04rem;font-weight:700}
.mine b{color:var(--blue);font-weight:800}
.mini{color:var(--sub);font-size:.88rem;font-weight:600;margin-top:6px}
.line{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--sep);font-variant-numeric:tabular-nums;font-size:.99rem;font-weight:600}
.line:last-child{border-bottom:0}
.line span:first-child{color:var(--sub)}
.line.sum span{color:var(--ink);font-weight:800}
.chip{display:inline-block;background:rgba(79,107,255,.14);color:var(--blue);border-radius:99px;padding:0 9px;font-size:.76rem;font-weight:700;margin-left:6px}
ul.tips{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:.96rem;font-weight:600}
ul.tips li{padding-left:22px;position:relative}
ul.tips li::before{content:"✓";position:absolute;left:0;color:var(--green);font-weight:700}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.89rem;font-weight:600;font-variant-numeric:tabular-nums}
th,td{padding:10px 6px;text-align:right;border-bottom:1px solid var(--sep);white-space:nowrap}
th{color:var(--sub);font-weight:800;font-size:.78rem}
th:first-child,td:first-child{text-align:left}
tr.hit td{background:rgba(79,107,255,.16);color:var(--blue);font-weight:800}
tr.best td{color:var(--blue);font-weight:800}
.disc{color:var(--sub);font-size:.78rem;font-weight:600;line-height:1.6;margin:24px 8px 0;text-align:center}
/* ===== 動態與互動 ===== */
@keyframes popIn{from{opacity:0;transform:translateY(22px) scale(.97)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}}
@keyframes cellIn{from{opacity:0;transform:translateY(10px) scale(.85)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.4)}100%{transform:scale(1)}}
@keyframes rip{from{transform:scale(0);opacity:.32}to{transform:scale(1);opacity:0}}
@keyframes glow{0%,100%{box-shadow:0 8px 24px rgba(79,107,255,.4),inset 0 1px 0 rgba(255,255,255,.45),0 0 0 0 rgba(138,92,255,.55)}60%{box-shadow:0 8px 24px rgba(79,107,255,.4),inset 0 1px 0 rgba(255,255,255,.45),0 0 0 14px rgba(138,92,255,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{to{background-position:200% center}}
@keyframes pulse{0%{transform:scale(1)}30%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes pill{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
h1{background:linear-gradient(90deg,#4f6bff,#8a5cff,#d86bd8,#8a5cff,#4f6bff);background-size:200% auto;-webkit-background-clip:text;background-clip:text;animation:shimmer 8s linear infinite}
.reveal{opacity:0;transform:translateY(20px);transition:opacity .7s cubic-bezier(.2,.7,.2,1) var(--d,0ms),transform .7s cubic-bezier(.2,.7,.2,1) var(--d,0ms)}
.reveal.in{opacity:1;transform:none}
.pop{animation:popIn .65s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:var(--d,0ms)}
.line{animation:fadeUp .45s ease backwards;animation-delay:calc(var(--i,0)*40ms + 350ms)}
.ladder div{animation:cellIn .5s cubic-bezier(.34,1.4,.64,1) backwards;animation-delay:calc(var(--i,0)*80ms + 300ms)}
.ladder div.on{animation:cellIn .5s cubic-bezier(.34,1.4,.64,1) backwards,pulse 1.1s ease 1.1s;animation-delay:calc(var(--i,0)*80ms + 300ms),1.1s}
.stepper output.bump{animation:bump .35s ease}
.stale.pulse{animation:pulse .5s ease}
.gc{display:inline-block;margin-left:8px;font-size:.72rem;font-weight:800;color:var(--blue);background:rgba(79,107,255,.14);border-radius:99px;padding:1px 9px;letter-spacing:0;vertical-align:1px}
.gc:empty{display:none}
.gc.pop{animation:pill .4s cubic-bezier(.34,1.56,.64,1)}
.row{transition:background .25s ease}
.row:focus-within{background:rgba(255,255,255,.38)}
.sprog{position:fixed;top:0;left:0;height:3px;width:0;background:var(--grad);z-index:40;border-radius:0 3px 3px 0;transition:width .12s linear}
.seg .thumb{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:10px;background:var(--grad);box-shadow:0 3px 10px rgba(79,107,255,.35)}
.seg.ready .thumb{transition:left .42s cubic-bezier(.34,1.4,.64,1),width .42s cubic-bezier(.34,1.4,.64,1)}
.rip-host{position:relative;overflow:hidden}
.ripple{position:absolute;border-radius:50%;background:currentColor;pointer-events:none;transform:scale(0);animation:rip .6s ease-out forwards}
.cta button,.link,.stepper button,.q{transition:transform .18s cubic-bezier(.34,1.56,.64,1),opacity .2s,background .2s}
.stepper button:active{transform:scale(.78)}
.link:active{transform:scale(.93)}
.cta button.ready{animation:glow 2.2s ease-out infinite}
.cta button.busy{pointer-events:none;opacity:.92}
.cta button.busy::before{content:"";display:inline-block;width:16px;height:16px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;margin-right:10px;vertical-align:-2px;animation:spin .7s linear infinite}
@media (hover:hover){.link:hover{transform:translateY(-1px)}.cta button:hover{transform:translateY(-1px)}.q:hover{transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none}.hero{transform:none}}
@media (max-width:420px){
  h1{font-size:1.85rem}
  .hero .n{font-size:2.6rem}
  .money input{width:6.6em}
  .seg button{padding:7px 10px}
  .row{padding:0 14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<div class="sprog" id="sprog" aria-hidden="true"></div>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="wrap">
  <header>
    <h1>個人綜合所得稅試算</h1>
    <p class="lead">照順序填,不確定就點旁邊的 <b style="color:var(--blue)">?</b> 看白話解說。填完按下方「計算我的稅」,馬上告訴你要繳多少、落在哪一級。</p>
    <div class="example"><button type="button" class="link" id="fillExample">帶入範例看看</button> <button type="button" class="link" id="clearAll" style="margin-left:14px">全部清空</button></div>
  </header>

  <div id="form"></div>

  <section id="result" hidden>
    <div class="stale" id="stale" hidden>你改了資料,下面是舊的結果。請再按一次「計算我的稅」。</div>
    <div id="out"></div>
  </section>

  <p class="disc">這是依財政部公告制度做的簡化試算,結果僅供參考,未含基本稅額(AMT)、財產交易損失、境外所得、夫妻分開申報等情形。實際稅額以國稅局核定為準,正式申報請使用財政部電子結算申報繳稅系統。</p>
</div>

<div class="cta"><div class="in"><button type="button" id="calc">計算我的稅</button></div></div>

<script>
/* ============ 稅制參數(114:國稅局試算現行;115:財政部 114/11/27 公告)============ */
var PARAMS={
  114:{name:'114 年度',ex:97000,exOld:145500,stdS:131000,stdM:262000,salary:218000,dis:218000,bl:213000,
       br:[{up:590000,r:.05},{up:1330000,r:.12},{up:2660000,r:.20},{up:4980000,r:.30},{up:Infinity,r:.40}]},
  115:{name:'115 年度',ex:101000,exOld:151500,stdS:136000,stdM:272000,salary:227000,dis:227000,bl:213000,blProvisional:true,
       br:[{up:610000,r:.05},{up:1380000,r:.12},{up:2770000,r:.20},{up:5190000,r:.30},{up:Infinity,r:.40}]}
};
var COMMON={savings:270000,tuition:25000,kid1:150000,kid2:225000,ltc:180000,rentLimit:180000,mortLimit:300000,lifeIns:24000,
  donRatio:.20,rentalRate:.43,divCreditRate:.085,divCreditCap:80000,divSepRate:.28};
function P(year){return Object.assign({},COMMON,PARAMS[year])}

/* ============ 計算(純函式)============ */
function N(v){v=Number(v);return isFinite(v)&&v>0?v:0}
function bIdx(net,Y){for(var i=0;i<Y.br.length;i++)if(net<=Y.br[i].up)return i;return Y.br.length-1}
function progTax(net,Y){var t=0,lo=0;for(var i=0;i<Y.br.length;i++){if(net>lo)t+=(Math.min(net,Y.br[i].up)-lo)*Y.br[i].r;lo=Y.br[i].up}return t}
function bDiff(i,Y){var lo=i?Y.br[i-1].up:0;return Math.round(Y.br[i].r*lo-progTax(lo,Y))}

function scenario(inp,Y,mode,div){
  var married=!!inp.married,depU=N(inp.depU),dep70=N(inp.dep70);
  var members=1+(married?1:0)+depU+dep70;
  var exemption=(inp.selfOld?Y.exOld:Y.ex)+(married?(inp.spouseOld?Y.exOld:Y.ex):0)+dep70*Y.exOld+depU*Y.ex;
  var salS=N(inp.salarySelf),salP=married?N(inp.salarySpouse):0;
  var interest=N(inp.interest),dividend=N(inp.dividend);
  var rentNet=N(inp.rentalActual)>0?Math.max(0,N(inp.rentalIncome)-N(inp.rentalActual)):N(inp.rentalIncome)*(1-Y.rentalRate);
  var practice=Math.max(0,N(inp.practiceGross)-N(inp.practiceCost));
  var divIn=div==='combined'?dividend:0;
  var gross=salS+salP+interest+divIn+rentNet+practice+N(inp.other);
  var savings=Math.min(Y.savings,interest+divIn);

  var deduction,detail={};
  if(mode==='std'){deduction=married?Y.stdM:Y.stdS}
  else{
    detail.donation=Math.min(N(inp.donation),gross*Y.donRatio);
    detail.insurance=Math.min(N(inp.lifeInsurance),Y.lifeIns*members)+N(inp.healthInsurance);
    detail.medical=N(inp.medical);
    detail.mortgage=Math.min(Y.mortLimit,Math.max(0,N(inp.mortM)*12-savings));
    deduction=detail.donation+detail.insurance+detail.medical+detail.mortgage;
  }
  var sp={};
  sp.salary=Math.min(salS,Y.salary)+Math.min(salP,Y.salary);
  sp.savings=savings;
  sp.dis=N(inp.dis)*Y.dis;
  sp.tuition=N(inp.students)*Y.tuition;
  var kc=N(inp.kids);sp.kids=kc>0?Y.kid1+(kc-1)*Y.kid2:0;
  sp.ltc=N(inp.ltc)*Y.ltc;
  sp.rent=inp.noHome?Math.min(N(inp.rent),Y.rentLimit):0;
  // 長照、租金:扣除後適用稅率 20% 以上,或股利選分開計稅,不得扣除
  var core=sp.salary+sp.savings+sp.dis+sp.tuition+sp.kids;
  var probe=Math.max(0,gross-exemption-deduction-core-sp.ltc-sp.rent);
  var blocked=false;
  if((sp.ltc>0||sp.rent>0)&&(Y.br[bIdx(probe,Y)].r>=.20||(div==='separate'&&dividend>0))){sp.ltc=0;sp.rent=0;blocked=true}
  var spTotal=core+sp.ltc+sp.rent;
  // 基本生活費差額:總額 −(免稅額+一般扣除額+特別扣除額,但不含薪資、儲蓄投資)
  var blTotal=Y.bl*members;
  var blUsed=exemption+deduction+sp.dis+sp.tuition+sp.kids+sp.ltc+sp.rent;
  var blDiff=Math.max(0,blTotal-blUsed);
  var net=Math.max(0,gross-exemption-deduction-spTotal-blDiff);
  var tax=progTax(net,Y),credit=0,sep=0;
  if(div==='combined')credit=Math.min(dividend*Y.divCreditRate,Y.divCreditCap);else sep=dividend*Y.divSepRate;
  var total=Math.round(tax-credit+sep),withheld=N(inp.withheld),bi=bIdx(net,Y),up=Y.br[bi].up;
  return {mode:mode,div:div,members:members,gross:gross,incomeTotal:gross+(div==='separate'?dividend:0),exemption:exemption,
    deduction:deduction,detail:detail,special:sp,spTotal:spTotal,blocked:blocked,blDiff:blDiff,net:net,bi:bi,rate:Y.br[bi].r,diff:bDiff(bi,Y),
    progressive:Math.round(tax),credit:credit,sepTax:sep,total:total,withheld:withheld,payable:total-withheld,
    headroom:isFinite(up)?up-net:null,nextRate:bi<Y.br.length-1?Y.br[bi+1].r:null};
}
function compute(inp,year){
  var Y=P(year),all={},best=null;
  ['std-combined','std-separate','item-combined','item-separate'].forEach(function(k){
    var p=k.split('-');all[k]=scenario(inp,Y,p[0],p[1]);
    if(best===null||all[k].total<all[best].total)best=k});
  return {Y:Y,all:all,best:best,r:all[best]};
}

  // 級距
  var ladder='<div class="ladder">'+Y.br.map(function(b,i){var l=i?Y.br[i-1].up:0;
    var rng=i===0?'0–'+Math.round(b.up/10000)+'萬':(isFinite(b.up)?Math.round(l/10000)+'–'+Math.round(b.up/10000)+'萬':Math.round(l/10000)+'萬以上');
    return '<div style="--i:'+i+'"'+(i===r.bi&&r.net>0?' class="on"':'')+'><b>'+pc(b.r)+'</b>'+rng+'</div>'}).join('')+'</div>';
  var mine,mini;
  if(r.net===0){mine='你的綜合所得淨額是 <b>0 元</b>,<b>不用繳稅</b>(還沒進入第 1 級)。';mini='扣掉免稅額和扣除額之後沒有剩下的所得。'}
  else{
    mine='你目前落在 <b>第 '+(r.bi+1)+' 級,稅率 '+pc(r.rate)+'</b>(淨所得 '+(r.bi?f(lo+1):'0')+(isFinite(up)?' ～ '+f(up):' 以上')+' 元)。';
    mini='稅額 = 淨所得 '+f(r.net)+' × '+pc(r.rate)+(r.diff?' − 累進差額 '+f(r.diff):'')+' = '+f(r.progressive)+' 元。'
      +(r.headroom===null?' 已經是最高級距。':' 淨所得再多 '+f(r.headroom)+' 元,就會進入下一級('+pc(r.nextRate)+')。');
  }
  h+='<div class="card"><h3>你的稅率級距</h3><p class="cap">稅率是「分級」計算的,超過的那一段才用比較高的稅率。</p>'+ladder
    +'<div class="mine">'+mine+'</div><div class="mini">'+mini+'</div></div>';

  // 算式
  var L=function(a,b,c){return '<div class="line'+(c?' sum':'')+'"><span>'+a+'</span><span>'+b+'</span></div>'};
  h+='<div class="card"><h3>怎麼算出來的</h3><p class="cap">由上往下,一步一步扣。</p>'
   +L('① 全年所得總額',f(r.incomeTotal))
   +L('② 免稅額(共 '+r.members+' 人)','− '+f(r.exemption))
   +L('③ '+(r.mode==='item'?'列舉扣除額':'標準扣除額')+'<span class="chip">自動選較省</span>','− '+f(r.deduction))
   +L('④ 特別扣除額'+(r.blocked?'<span class="chip">長照/租金因稅率達 20% 不可扣</span>':''),'− '+f(r.spTotal))
   +(r.blDiff>0?L('⑤ 基本生活費差額','− '+f(r.blDiff)):'')
   +L('＝ 綜合所得淨額',f(r.net),1)
   +L('累進稅額('+pc(r.rate)+')',f(r.progressive))
   +(r.credit>0?L('股利可抵減稅額','− '+f(r.credit)):'')+(r.sepTax>0?L('股利分開計稅(28%)','+ '+f(r.sepTax)):'')
   +L('全年應納稅額',f(r.total),1)+L('已經被扣的稅','− '+f(r.withheld))
   +L(refund?'可退稅':'應補繳',f(Math.abs(pay)),1)+'</div>';

  // 建議
  var tips=[],std=all['std-'+r.div],it=all['item-'+r.div],d=Math.abs(std.total-it.total);
  tips.push(r.mode==='item'?'你的花費比標準扣除額多,系統已幫你用「列舉」,比標準少繳 '+f(d)+' 元。':'標準扣除額比你的花費多,已幫你用「標準」'+(d>0?',用列舉會多繳 '+f(d)+' 元。':'。'));
  if(state.dividend>0){var oth=all[r.mode+'-'+(r.div==='combined'?'separate':'combined')];tips.push('股利採「'+(r.div==='combined'?'併入所得':'單獨 28%')+'」,比另一種少繳 '+f(Math.abs(oth.total-r.total))+' 元。')}
  if(r.blDiff>0)tips.push('你的家人多,基本生活費差額幫你多扣了 '+f(r.blDiff)+' 元所得。');
  if(PARAMS[state.year].blProvisional&&r.blDiff>0)tips.push('提醒:115 年度每人基本生活費財政部還沒公告,先用 114 年度的 21.3 萬計算,公告後可能微調。');
  h+='<div class="card"><h3>重點整理</h3><ul class="tips" style="margin-top:10px">'+tips.map(function(t){return '<li>'+t+'</li>'}).join('')+'</ul></div>';

  // 級距表
  var tb='<tr><th>綜合所得淨額</th><th>稅率</th><th>累進差額</th></tr>'+Y.br.map(function(b,i){var l=i?Y.br[i-1].up:0;
    var rng=i===0?'0 ～ '+f(b.up):(isFinite(b.up)?f(l+1)+' ～ '+f(b.up):f(l+1)+' 以上');
    return '<tr'+(i===r.bi&&r.net>0?' class="hit"':'')+'><td>'+rng+'</td><td>'+pc(b.r)+'</td><td>'+f(bDiff(i,Y))+'</td></tr>'}).join('');
  h+='<div class="card"><h3>'+PARAMS[state.year].name+' 課稅級距表</h3><p class="cap">反白那一列就是你。</p><div class="tw"><table>'+tb+'</table></div></div>';

  // 方案比較
  var nm={std:'標準',item:'列舉',combined:'合併',separate:'分開'};
  var cmp='<tr><th>方案</th><th>淨所得</th><th>稅額</th></tr>'+Object.keys(all).map(function(k){var s=all[k],p=k.split('-');
    return '<tr'+(k===o.best?' class="best"':'')+'><td>'+nm[p[0]]+' / '+nm[p[1]]+(k===o.best?'(最省)':'')+'</td><td>'+f(s.net)+'</td><td>'+f(s.total)+'</td></tr>'}).join('');
  h+='<details class="more" style="margin-top:14px"><summary><span>看四種方案的比較<span class="sumsub">標準 / 列舉、股利併入 / 分開</span></span></summary><div class="list" style="padding:8px 16px"><div class="tw"><table>'+cmp+'</table></div></div></details>';
  $('out').innerHTML=h;
}
var reduce=false,fine=false,busy=false;
try{reduce=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);fine=!!(window.matchMedia&&matchMedia('(hover:hover) and (pointer:fine)').matches)}catch(e){}
var RAF=window.requestAnimationFrame?function(fn){return window.requestAnimationFrame(fn)}:null;
function tick(){try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}}
function placeThumb(seg){if(!seg)return;var b=seg.querySelector('[aria-pressed="true"]'),t=seg.querySelector('.thumb');if(!b||!t)return;
  t.style.left=b.offsetLeft+'px';t.style.width=b.offsetWidth+'px';
  if(!seg.classList.contains('ready')){setTimeout(function(){seg.classList.add('ready')},60)}}
function placeAllThumbs(){document.querySelectorAll('.seg').forEach(placeThumb)}
function countUp(){var el=document.querySelector('#out .cnt');if(!el||!RAF||reduce)return;var v=+el.dataset.v;if(!(v>0))return;
  var t0=null,dur=1000;el.textContent='0';
  (function step(t){if(t0===null)t0=t;var p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);el.textContent=f(v*e);if(p<1)RAF(step);else el.textContent=f(v)})(performance.now?performance.now():0);
  RAF(function(){})}
function animateResult(){var out=$('out');
  Array.prototype.forEach.call(out.children,function(c,i){c.classList.add('pop');c.style.setProperty('--d',(i*80)+'ms')});
  Array.prototype.forEach.call(out.querySelectorAll('.line'),function(l,i){l.style.setProperty('--i',i)});
  countUp()}
function calc(){
  if(busy)return;
  var btn=$('calc');
  if(reduce||!RAF){doCalc();return}
  busy=true;btn.classList.add('busy');btn.textContent='計算中…';
  setTimeout(function(){busy=false;btn.classList.remove('busy');doCalc()},520);
}
function doCalc(){
  var empty=!['salarySelf','salarySpouse','practiceGross','interest','dividend','rentalIncome','other'].some(function(k){return state[k]>0});
  if(empty){
    $('result').hidden=false;$('stale').hidden=true;$('out').classList.remove('dim');
    $('out').innerHTML='<div class="hero"><div class="k">還沒有填收入</div><div class="why" style="margin-top:8px">請先在「第 2 步・你的收入」填入薪水或其他收入,再按一次「計算我的稅」。</div></div>';
  }else{renderResult();$('result').hidden=false;$('stale').hidden=true;$('out').classList.remove('dim')}
  calculated=true;sync();animateResult();
  var el=$('result');if(el.scrollIntoView){try{el.scrollIntoView({behavior:'smooth',block:'start'})}catch(e){el.scrollIntoView()}}
}
function touched(){if(calculated){var st=$('stale');if(st.hidden){st.hidden=false}else{st.classList.remove('pulse');void st.offsetWidth}st.classList.add('pulse');$('out').classList.add('dim')}}

function initFx(){
  var els=document.querySelectorAll('header,.group,details.more');
  els.forEach(function(e,i){e.classList.add('reveal');e.style.setProperty('--d',((i%6)*70)+'ms')});
  var showAll=function(){els.forEach(function(e){e.classList.add('in')})};
  if(!('IntersectionObserver' in window)||reduce){showAll()}
  else{var io=new IntersectionObserver(function(es){es.forEach(function(x){if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}})},{threshold:.06});
    els.forEach(function(e){io.observe(e)});setTimeout(showAll,2800)}
  var sp=$('sprog'),tk=false;
  window.addEventListener('scroll',function(){if(tk)return;tk=true;(RAF||function(fn){fn()})(function(){tk=false;var h=document.documentElement.scrollHeight-window.innerHeight;sp.style.width=(h>0?Math.min(100,window.scrollY/h*100):0)+'%'})},{passive:true});
  if(fine&&!reduce){var bg=document.querySelector('.bg');
    window.addEventListener('pointermove',function(e){bg.style.setProperty('--px',((e.clientX/window.innerWidth-.5)*-28).toFixed(1)+'px');bg.style.setProperty('--py',((e.clientY/window.innerHeight-.5)*-28).toFixed(1)+'px')},{passive:true});
    $('out').addEventListener('pointermove',function(e){var h=e.target.closest&&e.target.closest('.hero');if(!h)return;var r=h.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
      h.style.setProperty('--rx',((.5-y)*6).toFixed(2)+'deg');h.style.setProperty('--ry',((x-.5)*8).toFixed(2)+'deg');h.style.setProperty('--lx',(x*100).toFixed(0)+'%');h.style.setProperty('--ly',(y*100).toFixed(0)+'%')});
    $('out').addEventListener('pointerout',function(e){var h=e.target.closest&&e.target.closest('.hero');if(h&&!h.contains(e.relatedTarget)){h.style.setProperty('--rx','0deg');h.style.setProperty('--ry','0deg');h.style.setProperty('--lx','50%');h.style.setProperty('--ly','0%')}})}
  document.addEventListener('pointerdown',function(e){if(reduce)return;var b=e.target.closest&&e.target.closest('.cta button,.link,.q,.stepper button');if(!b)return;
    b.classList.add('rip-host');var r=b.getBoundingClientRect(),z=Math.max(r.width,r.height)*2,s=document.createElement('span');
    s.className='ripple';s.style.cssText='width:'+z+'px;height:'+z+'px;left:'+(e.clientX-r.left-z/2)+'px;top:'+(e.clientY-r.top-z/2)+'px';b.appendChild(s);setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s)},650)});
  document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.type==='number'){e.preventDefault();e.target.blur();calc()}});
  window.addEventListener('resize',placeAllThumbs);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(placeAllThumbs);
  placeAllThumbs();
}
build();sync();initFx();

document.addEventListener('input',function(e){
  var k=e.target.dataset&&e.target.dataset.k;if(!k)return;
  if(e.target.type==='checkbox')tick();state[k]=e.target.type==='checkbox'?e.target.checked:(parseFloat(e.target.value)||0);touched();sync();
});
document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.dataset.q||b.dataset.seg||b.dataset.inc||b.dataset.dec)tick();
  if(b.dataset.q){var it=allItems().filter(function(x){return x.k===b.dataset.q})[0],hp=$('h_'+it.k),open=!hp.classList.contains('open');
    if(open){hp.innerHTML=helpHtml(it);hp.style.setProperty('--h',(hp.scrollHeight+60)+'px')}
    hp.classList.toggle('open',open);hp.setAttribute('aria-hidden',String(!open));b.setAttribute('aria-expanded',String(open));return}
  if(b.dataset.seg){state[b.dataset.seg]=b.dataset.v;if(b.dataset.seg==='year'&&calculated)touched();else touched();sync();return}
  var k=b.dataset.inc||b.dataset.dec;
  if(k){state[k]=Math.max(0,Math.min(20,(state[k]||0)+(b.dataset.inc?1:-1)));touched();sync()}
});
$('calc').onclick=calc;
$('clearAll').onclick=function(){var y=state.year;state={year:y,married:'0'};
  allItems().forEach(function(it){if(!it.t||it.t==='money'){var i=$('i_'+it.k);if(i)i.value=''}});
  calculated=false;$('result').hidden=true;sync()};
$('fillExample').onclick=function(){
  state={year:state.year,married:'1',depU:1,salarySelf:900000,salarySpouse:500000,withheld:60000,kids:1,mortM:12000,medical:20000,donation:10000,lifeInsurance:30000,healthInsurance:28000};
  allItems().forEach(function(it){if(!it.t){var i=$('i_'+it.k);if(i)i.value=state[it.k]||''}});
  sync();touched();
};
</script>
</body>
